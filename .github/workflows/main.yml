name: Update word counts + view counts daily

on:
  schedule:
    # 毎日 UTC 18:00 = ベトナム時間 01:00 / 日本時間 03:00
    - cron: '0 18 * * *'
  workflow_dispatch:  # 手動実行も可能

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run update script
        env:
          BLOGGER_API_KEY: ${{ secrets.BLOGGER_API_KEY }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        run: python scripts/update_word_counts.py

      # 閲覧数集計 (GA4 Data API → view_counts.js)。失敗しても word counts の更新は継続
      - name: Install GA4 dependencies
        run: pip install google-analytics-data google-auth

      - name: Run view count update
        id: views
        continue-on-error: true
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
        run: python scripts/update_view_counts.py

      - name: Check for changes
        id: check
        run: |
          if [[ -n $(git status --porcelain word_counts.js view_counts.js) ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add word_counts.js
          git add view_counts.js 2>/dev/null || true
          git commit -m "Auto update word counts ($(date +'%Y-%m-%d %H:%M ICT'))"
          git push

      - name: Summary
        run: |
          if [[ "${{ steps.check.outputs.changed }}" == "true" ]]; then
            echo "✅ 変更あり: word_counts.js / view_counts.js を更新しました" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ 変更なし: スキップしました" >> $GITHUB_STEP_SUMMARY
          fi
          if [[ "${{ steps.views.outcome }}" == "failure" ]]; then
            echo "⚠️ view counts ステップは失敗 (GA4 secrets/API を確認)" >> $GITHUB_STEP_SUMMARY
          else
            echo "👁 view counts: ${{ steps.views.outcome }}" >> $GITHUB_STEP_SUMMARY
          fi
